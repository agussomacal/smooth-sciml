[project]
name = "05-reduced-order-modeling"
version = "0.1.0"
requires-python = ">=3.12"

dependencies = [
    # Core Data Science & Numerical
    "matplotlib>=3.7.1",
    "numpy>=1.24.4",
    "scipy>=1.10.1",
    "scikit-learn>=1.2.2",
    "pathos>=0.3.0",
    "joblib>=1.3.1",

    # Machine Learning & JAX Stack
    "jax>=0.5.0",
    "jaxlib>=0.4.13",
    "flax",
    "optax",

    # Utilities & Visualization
    "tqdm",
    "seaborn>=0.12.2",

    # Jupyter & Interactive Computing
    "ipykernel>=6.24.0",
    "ipywidgets>=8.0.6",
    "jupyterlab>=4.2.4",
    "jupyterlab_myst>=2.4.2",

    "PerplexityLab"
]


[tool.uv.sources]
# Explicitly force this package to come from Git with the exact revision
PerplexityLab = { git = "https://codeberg.org/akuasoma/PerplexityLab", rev = "383d25e09c042ec87099b357d0f2b55498343fc8" }